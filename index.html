<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>Stage Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!--
  STAGE CLOCK – The Message
  One file, no login. Upload to GitHub Pages (or any static host).
  Devices sync live through a free public MQTT server (see BROKER below).
  Every event gets a private "room code" that lives in the link (#stage/CODE, #control/CODE).
-->
<style>
:root{
  --bg:#08080b; --panel:#121218; --panel2:#1b1b23; --line:#272731;
  --text:#f4f4f6; --muted:#8b8b97; --accent:#F2F2F5; --accent2:var(--accent); --on-accent:#0b0b0b;
  --ok:#2fe39b; --warn:#ff8a1f; --over:#ff3b47;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent2)}
[hidden]{display:none!important}

/* ---------- Home ---------- */
.home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.home-inner{width:100%;max-width:560px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700}
.home h1{font-size:40px;font-weight:900;letter-spacing:-.02em;margin:6px 0 8px}
.lead{color:var(--muted);line-height:1.5;margin-bottom:24px}
.room{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.room-code{font-size:13px;color:var(--muted)}
.room-code b{color:var(--text);font-size:15px;letter-spacing:.02em}
.linkrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.linkrow:first-of-type{border-top:0}
.linkrow .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--panel2)}
.linkrow .tx{flex:1;min-width:0}
.linkrow b{display:block;font-size:16px}
.linkrow span{color:var(--muted);font-size:13px;line-height:1.35}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.mini.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qr{display:flex;gap:14px;align-items:center;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.qr #qrBox{background:#fff;padding:8px;border-radius:10px;flex:none;line-height:0}
.qr p{font-size:13px;color:var(--muted);line-height:1.5}
.join{display:flex;gap:8px;margin-top:10px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:14px;padding:14px 16px;border-radius:12px;background:#ffffff08}

/* ---------- Stage ---------- */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:3vh 4vw;overflow:hidden;background:var(--bg);transition:background .5s;user-select:none}
.stage.over{background:#1c0407}
.st-top{display:flex;justify-content:space-between;align-items:center;font-size:max(14px,2.2vw);color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.st-clock{color:var(--text);letter-spacing:0;font-variant-numeric:tabular-nums}
.st-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0}
.st-title{font-size:max(22px,4.4vw);font-weight:800;line-height:1.05;max-width:92vw;letter-spacing:-.01em}
.st-who{font-size:max(15px,2.3vw);color:var(--muted);margin-top:.8vh;font-weight:500}
.st-timer{font-size:min(25vw,46vh);font-weight:800;line-height:.92;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:2.5vh 0 3vh;transition:color .4s}
.stage.has-songs .st-title{font-size:max(18px,3vw)}
.stage.has-songs .st-who{font-size:max(13px,1.8vw)}
.stage.has-songs .st-timer{font-size:min(19vw,33vh);margin:1.5vh 0 2vh}
.stage.idle .st-timer{color:#d9d9e0;font-weight:700}
.stage.warn .st-timer{color:var(--warn)}
.stage.over .st-timer{color:var(--over);animation:blink 1s steps(1) infinite}
.st-bar{width:78vw;height:max(6px,1.1vh);background:#ffffff14;border-radius:99px;overflow:hidden}
.st-bar>i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .25s linear,background .4s}
.stage.warn .st-bar>i{background:var(--warn)}
.stage.over .st-bar>i{background:var(--over)}
.stage.idle .st-bar{visibility:hidden}
.st-state{margin-top:2vh;font-size:max(13px,1.7vw);letter-spacing:.2em;font-weight:800;text-transform:uppercase;color:var(--muted);min-height:1.2em}
.stage.over .st-state{color:var(--over)}
.st-songs{width:82vw;margin-top:2.6vh;display:flex;flex-direction:column;gap:1.2vh}
.song{display:flex;align-items:center;gap:1.6vw;padding:1.6vh 2vw;border-radius:1.4vw;text-align:left}
.song.now{background:color-mix(in srgb,var(--accent) 9%,transparent);border:2px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.song.nx{opacity:.6}
.song .lbl{font-size:max(11px,1.3vw);font-weight:800;letter-spacing:.18em;color:var(--accent2);width:7vw;flex:none}
.song.nx .lbl{color:var(--muted)}
.song .nm{flex:1;min-width:0;font-weight:800;font-size:max(18px,3.4vw);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song.nx .nm{font-size:max(15px,2.3vw);font-weight:700}
.song .key{font-weight:900;font-size:max(16px,2.8vw);background:var(--accent);color:var(--on-accent);border-radius:.8vw;padding:.3vh 1.2vw;flex:none;font-variant-numeric:tabular-nums}
.song.nx .key{font-size:max(13px,1.9vw);background:#ffffff30;color:#fff}
.song .ld{color:var(--muted);font-weight:600;font-size:max(14px,2.2vw);flex:none;max-width:24vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song.nx .ld{font-size:max(12px,1.6vw)}
.song-note{color:var(--accent);font-weight:700;font-size:max(13px,1.9vw);padding:0 2vw}
.st-next{font-size:max(15px,2.4vw);color:var(--muted);text-align:center;min-height:1.3em}
.st-next b{color:var(--text);font-weight:700}
.st-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);font-weight:900;padding:6vh 6vw;text-align:center;line-height:1.05;letter-spacing:-.02em;z-index:4;overflow-wrap:anywhere}
.st-msg.s1{font-size:min(15vw,30vh)} .st-msg.s2{font-size:min(10vw,20vh)} .st-msg.s3{font-size:min(8vw,16vh)} .st-msg.s4{font-size:min(6vw,12vh)}
.st-msg.flash{animation:flash .9s ease-in-out infinite alternate}
.st-blank{position:absolute;inset:0;background:#000;z-index:5}
.st-fs{position:absolute;top:1.5vh;left:50%;transform:translateX(-50%);background:#ffffff14;border:1px solid #ffffff22;color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:99px;z-index:6;transition:opacity .4s}
.st-fs.hide{opacity:0;pointer-events:none}
.st-conn{position:absolute;bottom:1vh;right:1.2vw;font-size:12px;color:#ffffff55;z-index:6}
.st-conn.bad{font-size:15px;color:var(--warn);font-weight:700;left:1.2vw;text-align:center}
@keyframes blink{50%{opacity:.35}}
@keyframes flash{from{background:var(--accent)}to{background:color-mix(in srgb,var(--accent) 45%,#fff)}}

/* ---------- Control ---------- */
.ctl{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.ctl-head{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 16px;gap:12px}
.ctl-head h1{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.ctl-head a{color:var(--muted);font-size:13px;text-decoration:none}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--panel2);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{color:var(--ok)} .pill.off{color:var(--over)}
.live{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,#121218),#121218 62%);border:1px solid color-mix(in srgb,var(--accent) 30%,#272731);border-radius:22px;padding:16px 16px 14px;margin-bottom:14px;position:sticky;top:8px;z-index:4;box-shadow:0 10px 30px #0009}
.live-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);font-weight:800}
.live-title{font-size:18px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-sub{font-size:13px;color:var(--muted);margin-top:2px;min-height:1.2em}
.sched{font-size:13px;font-weight:700;margin-top:4px;min-height:1.2em;color:var(--muted)}
.sched.ok{color:var(--ok)} .sched.late{color:var(--warn)}
.live-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.live-timer{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:8px 0 10px;font-variant-numeric:tabular-nums;transition:color .3s}
.live-song{font-size:13px;font-weight:700;color:var(--accent2);text-align:right;margin-bottom:14px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live.warn .live-timer{color:var(--warn)} .live.over .live-timer{color:var(--over)}
.bar{height:6px;background:#ffffff14;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s linear}
.live.warn .bar>i{background:var(--warn)} .live.over .bar>i{background:var(--over)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 8px;font-weight:700;font-size:15px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary.running{background:color-mix(in srgb,var(--accent) 16%,#121218);border-color:color-mix(in srgb,var(--accent) 45%,#272731);color:var(--accent)}
.btn.danger{color:var(--over)}
.btn:disabled{opacity:.4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:800}
.row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.row-head span{font-size:13px;color:var(--muted)}
.setlist{list-style:none}
.sg{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;cursor:pointer}
.sg+.sg{margin-top:2px}
.sg.cur{background:color-mix(in srgb,var(--accent) 9%,transparent);outline:1px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.sg.done{opacity:.4}
.sg .n{width:20px;color:var(--muted);font-size:13px;font-weight:700;flex:none}
.sg .nm{flex:1;min-width:0;font-weight:700;font-size:15px}
.sg .nm small{display:block;color:var(--accent);font-weight:600;font-size:12px;margin-top:2px}
.sg .ld{color:var(--muted);font-size:13px;flex:none;max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .key{font-size:12px;font-weight:900;background:#ffffff18;border-radius:6px;padding:3px 7px;flex:none}
.sg.cur .key{background:var(--accent);color:var(--on-accent)}
.msg-cur{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);border-radius:12px;padding:10px 12px;margin:10px 0 0;font-weight:700}
.msg-cur span{flex:1;min-width:0;overflow-wrap:anywhere}
.msg-cur button{font-size:15px;font-weight:800;color:var(--on-accent);background:var(--accent);border-radius:10px;padding:10px 16px;white-space:nowrap}
.msg-form{display:flex;gap:8px;margin-top:12px}
.input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:120px;line-height:1.45;font-size:14px}
.msg-form .btn{padding:12px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:14px;font-weight:600}
.chip:active{background:var(--accent);color:var(--on-accent)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-top:12px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.rundown{list-style:none}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.done{opacity:.45}
.go{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px}
.item.is-live .go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.it-body{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.it-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.is-live .it-title{color:var(--accent2)}
.it-meta{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{width:34px;height:21px;border-radius:6px;background:var(--panel2);font-size:11px;color:var(--muted)}
.add{width:100%;margin-top:10px;padding:14px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--accent) 35%,#272731);color:var(--accent2);font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:8px 0 4px}
.rundown .sep{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);padding:14px 0 4px;border-top:0}
.rundown .sep+.item{border-top:0}
.ev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev b{display:block;font-size:16px}
.ev span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ev .go{flex:none}
.ev.sel b{color:var(--accent)}
.ev.sel .go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.set-row:first-of-type{border-top:0}
.set-row .input{flex:none;width:170px;padding:9px 12px;font-size:15px}
.set-row .input.sm{width:84px;text-align:center}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#33333d;border-radius:99px;transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i:after{transform:translateX(20px);background:var(--on-accent)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.field .input{width:100%}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.4}
.dur{display:flex;gap:8px;align-items:center}
.dur .input{text-align:center}
.dur span{color:var(--muted)}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.sheet-actions .btn{flex:1}
.confirm-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:360px;margin:auto}
.confirm-box p{line-height:1.5;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#fff;color:#000;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- Backstage ---------- */
.bs{position:fixed;inset:0;display:flex;flex-direction:column;gap:2.4vh;padding:3vh 4vw;background:var(--bg);overflow:hidden;user-select:none}
.bs .lbl{font-size:max(12px,1.4vw);font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.bs-now{display:flex;align-items:center;gap:3vw;padding:2.2vh 2.4vw;border-radius:1.6vw;background:var(--panel);border:1px solid var(--line)}
.bs-now .tx{flex:1;min-width:0}
.bs-now-title{font-size:max(18px,3vw);font-weight:800;margin-top:.6vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-now-who{font-size:max(13px,1.8vw);color:var(--muted);margin-top:.3vh}
.bs-now-time{font-size:max(28px,5.5vw);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bs-now-time.warn{color:var(--warn)} .bs-now-time.over{color:var(--over)}
.bs-next{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:3vh 3vw;border-radius:2vw;border:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent);transition:background .4s,color .4s}
.bs-next .lbl{color:var(--accent);font-size:max(14px,1.9vw)}
.bs-next-title{font-size:max(30px,6.4vw);font-weight:900;line-height:1.02;letter-spacing:-.02em;margin-top:1.4vh}
.bs-next-who{font-size:max(18px,3.4vw);font-weight:600;margin-top:1vh;color:#e6e6ea}
.bs-next-in{font-size:max(18px,3.2vw);font-weight:800;margin-top:2.4vh;font-variant-numeric:tabular-nums;color:var(--accent)}
.bs-next.ready{background:var(--accent);color:var(--on-accent)}
.bs-next.ready .lbl,.bs-next.ready .bs-next-in,.bs-next.ready .bs-next-who{color:var(--on-accent)}
.bs-next.standby{animation:standby 1s ease-in-out infinite alternate}
@keyframes standby{from{background:var(--accent)}to{background:color-mix(in srgb,var(--accent) 45%,#fff)}}
.bs-later{display:flex;gap:1.4vw}
.bs-later .li{flex:1;min-width:0;padding:1.6vh 1.6vw;border-radius:1.2vw;background:var(--panel);border:1px solid var(--line)}
.bs-later .li b{display:block;font-size:max(14px,1.9vw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-later .li span{display:block;font-size:max(12px,1.5vw);color:var(--muted);margin-top:.4vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs-later .li em{font-style:normal;color:var(--accent);font-weight:700}
/* ---------- Catch-up suggestion ---------- */
.catch{background:#ff8a1f12;border:1px solid #ff8a1f66;border-radius:18px;padding:14px 16px;margin-bottom:14px}
.catch h3{font-size:15px;font-weight:800;color:var(--warn)}
.catch p{font-size:14px;line-height:1.45;margin-top:6px;color:#e6e6ea}
.catch ul{list-style:none;margin-top:8px}
.catch li{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:6px 0;border-top:1px solid #ff8a1f33}
.catch li span{color:var(--warn)}

function parseHash(){
  var h = location.hash.replace(/^#/, "");
  var m = h.match(/^(stage|control|backstage|manager)(?:\/([A-Za-z0-9_-]{4,64}))?$/);
  if (m) return { view: m[1], room: m[2] || null };
  return { view: h === "devices" ? "devices" : "home", room: null };
}
function route(){
  var r = parseHash();
  if (r.view === "home") {
    var role = store("sc-role");
    if (ROLE_LABEL[role]) { location.replace("#" + role); return; }
    r.view = "devices";
  }
  if (r.view !== "devices" && !teamKey()) { gateFor = r.view; disconnect(); conn = "idle"; view = "gate"; document.body.style.overflow = ""; $("app").innerHTML = gateHTML(); bindGate(); return; }
  stopPairing();
  var prevRoom = ROOM, prevFollow = FOLLOW, prevView = view;
  view = r.view;
  FOLLOW = (view === "stage" || view === "backstage" || view === "manager") && !r.room;
  if (view === "control" && !r.room) view = "pick";
  if (r.room) ROOM = r.room;
  else if (FOLLOW) ROOM = (prevFollow && ROOM) || store("sc-follow-room") || null;
  else ROOM = null;
  if (view === "control") { store("sc-last-room", ROOM); }
  document.body.style.overflow = (view === "stage" || view === "backstage") ? "hidden" : "";
  var app = $("app");
  window.onscroll = null;
  if (view === "devices") { app.innerHTML = devicesHTML(); bindDevices(); }
  else if (view === "pick") { app.innerHTML = pickHTML(); bindPick(); }
  else if (view === "stage") { app.innerHTML = stageHTML(); bindStage(); }
  else if (view === "backstage") { app.innerHTML = backstageHTML(); bindBackstage(); }
  else if (view === "manager") { app.innerHTML = managerHTML(); bindManager(); }
  else { app.innerHTML = controlHTML(); bindControl(); }
  if (view === "devices" || view === "pick") { disconnect(); conn = "idle"; }
  else if (ROOM !== prevRoom || FOLLOW !== prevFollow || prevView !== view || !clients.length) connect();
  fill();
}

/* ============================================================
   CONNECT A DEVICE (team key + 6-digit pairing)
   ============================================================ */
var PAIR_PREFIX = TOPIC_PREFIX + "pair/", gateFor = null, pairClients = [];
function brokerClients(onConnect, onMessage){
  var list = [];
  if (!window.mqtt) return list;
  BROKERS.forEach(function(url){
    try {
      var c = window.mqtt.connect(url, { clientId: "sp_" + rnd(12), clean: true, keepalive: 20, reconnectPeriod: 3000, connectTimeout: 10000 });
      c.on("connect", function(){ onConnect(c); });
      c.on("message", function(t, p){ onMessage(t, new TextDecoder().decode(p), c); });
      list.push(c);
    } catch(e){}
  });
  return list;
}
function endClients(list){ list.forEach(function(c){ try { c.end(true); } catch(e){} }); }
function stopPairing(){ endClients(pairClients); pairClients = []; }
var ECDH = { name: "ECDH", namedCurve: "P-256" };
function shared(kp, otherJwk, use){
  return crypto.subtle.importKey("jwk", otherJwk, ECDH, false, []).then(function(pk){
    return crypto.subtle.deriveKey({ name: "ECDH", public: pk }, kp.privateKey, { name: "AES-GCM", length: 256 }, false, [use]);
  });
}
// The new device shows a code and waits; a phone that has the key sends it over, encrypted just for this device.
function startPairing(){
  stopPairing();
  var codeEl = $("pairCode"), st = $("pairStatus");
  if (!window.mqtt || !window.crypto || !crypto.subtle) { if (st) st.textContent = "Can’t connect yet – check the internet."; setTimeout(function(){ if (view === "gate") startPairing(); }, 2000); return; }
  var code = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
  var screenT = PAIR_PREFIX + code + "/screen", phoneT = PAIR_PREFIX + code + "/phone", done = false;
  crypto.subtle.generateKey(ECDH, true, ["deriveKey"]).then(function(kp){
    return crypto.subtle.exportKey("jwk", kp.publicKey).then(function(jwk){
      if (view !== "gate") return;
      if (codeEl) codeEl.textContent = code.slice(0, 3) + " " + code.slice(3);
      if (st) st.textContent = "Connecting …";
      pairClients = brokerClients(function(c){
        c.subscribe(phoneT, { qos: 1 });
        c.publish(screenT, JSON.stringify({ pub: jwk, role: gateFor }), { qos: 1, retain: true });
        if (st && !done) st.textContent = "Waiting for your phone …";
      }, function(t, raw){
        if (t !== phoneT || done || !raw) return;
        var m; try { m = JSON.parse(raw); } catch(e){ return; }
        shared(kp, m.pub, "decrypt").then(function(k){ return aesOpen(k, m.box); }).then(function(d){
          if (done || !d || !d.key) return;
          done = true; setTeamKey(d.key);
          pairClients.forEach(function(cc){ if (cc.connected) cc.publish(screenT, "", { qos: 1, retain: true }); });
          if (st) st.textContent = "Connected ✓";
          setTimeout(function(){ stopPairing(); toast("Connected"); route(); }, 700);
        }).catch(function(){});
      });
    });
  });
}
// On a phone/laptop that already has the key: send it to the device showing this code.
function connectScreen(code, cb){
  code = String(code || "").replace(/\D/g, "");
  if (code.length !== 6) return cb("Type the 6-digit code shown on the screen.");
  if (!teamKey()) return cb("This device isn’t connected itself.");
  var screenT = PAIR_PREFIX + code + "/screen", phoneT = PAIR_PREFIX + code + "/phone", done = false, list = [];
  var timer = setTimeout(function(){ if (!done) { done = true; endClients(list); cb("No screen found with that code. Check the code and that the screen is online."); } }, 15000);
  list = brokerClients(function(c){ c.subscribe(screenT, { qos: 1 }); }, function(t, raw){
    if (done || t !== screenT || !raw) return;
    var m; try { m = JSON.parse(raw); } catch(e){ return; }
    if (!m || !m.pub) return;
    done = true; clearTimeout(timer);
    crypto.subtle.generateKey(ECDH, true, ["deriveKey"]).then(function(kp){
      return Promise.all([crypto.subtle.exportKey("jwk", kp.publicKey), shared(kp, m.pub, "encrypt")]);
    }).then(function(r){
      return aesSeal(r[1], { key: teamKey() }).then(function(box){
        var msg = JSON.stringify({ pub: r[0], box: box });
        list.forEach(function(c){ if (c.connected) c.publish(phoneT, msg, { qos: 1 }); });
      });
    }).then(function(){ setTimeout(function(){ endClients(list); }, 2500); cb(null, m.role); },
             function(){ endClients(list); cb("That didn’t work – please try again."); });
  });
}

   STAGE MANAGER (read-only phone view)
   ============================================================ */
function splitNames(s){ return String(s || "").split(/\s*(?:,|\+|&|\/|\band\b)\s*/i).map(function(x){ return x.trim(); }).filter(function(x){ return x && !/^[?\s]+$/.test(x); }); }
function minutesOf(hhmm){ var p = String(hhmm || "").split(":"); return p.length === 2 ? (+p[0]) * 60 + (+p[1]) : null; }
var MUSIC = /band|worship|vocal|music|praise|singer/i;
// Who is needed for an item: names in the plan, song leads, and the band/vocals scheduled for that part of the night.
function windowFor(it){
  var wins = state.windows || [], m = minutesOf(it.at);
  if (!wins.length || m == null) return -1;
  // 15 min tolerance, because a set often starts a little before the next service time.
  var k = 0; wins.forEach(function(w, i){ if (m + 15 >= minutesOf(w.from)) k = i; });
  return k;
}
function roleOf(r){ return /^worship team$/i.test(r.position || "") || !r.position ? (r.team || "") : r.position; }
function peopleFor(it){
  var out = [];
  // "Josh W." / "Josh" and "Josh Woodfield" are the same person.
  function same(x, y){
    var a = x.toLowerCase().replace(/\./g, "").split(/\s+/), b = y.toLowerCase().replace(/\./g, "").split(/\s+/);
    if (a.length > b.length) { var t = a; a = b; b = t; }
    if (a[0] !== b[0]) return false;
    return a.length === 1 || (b[1] && a[1] && b[1].indexOf(a[1]) === 0);
  }
  function find(name){ for (var i = 0; i < out.length; i++) if (same(out[i].name, name)) return out[i]; return null; }
  function add(name, role){
    var ex = find(name);
    if (ex) {
      if (name.length > ex.name.length) ex.name = name;           // keep the full name
      if (role && ex.roles.indexOf(role) < 0) ex.roles.push(role);
      return;
    }
    out.push({ name: name, roles: role ? [role] : [] });
  }
  splitNames(it.who).forEach(function(n){ if (!/crew|team$/i.test(n)) add(n, ""); });
  it.songs.forEach(function(g){ splitNames(g.lead).forEach(function(n){ add(n, "lead"); }); });

  var roster = state.roster || [], wins = state.windows || [];
  var music = roster.filter(function(r){ return MUSIC.test(r.team); });
  var haveTimes = music.some(function(r){ return r.times && r.times.length; }) && wins.some(function(w){ return w.id; });
  var pick = [];
  var numMatch = (it.title + " " + it.who).match(/(?:team|band|group)\s*(\d)/i);
  if (it.songs.length || numMatch) {
    var k = numMatch ? Math.min(+numMatch[1] - 1, wins.length - 1) : windowFor(it);
    if (haveTimes && k >= 0) {
      var wid = wins[k].id;
      pick = music.filter(function(r){ return r.times && r.times.indexOf(wid) >= 0; });
    } else if (it.songs.length) {
      var teamNames = []; music.forEach(function(r){ if (teamNames.indexOf(r.team) < 0) teamNames.push(r.team); });
      if (k >= 0 && wins[k].teams && wins.some(function(w){ return w.teams && w.teams.length; })) pick = music.filter(function(r){ return wins[k].teams.indexOf(r.team) >= 0; });
      else {
        var numbered = teamNames.filter(function(n){ return /\d/.test(n); });
        pick = numbered.length >= 2 && k >= 0 ? music.filter(function(r){ var d = r.team.match(/\d+/); return !d || +d[0] === k + 1; }) : music;
      }
    }
  } else {
    var t = (it.title + " " + it.who).toLowerCase();
    pick = roster.filter(function(r){ return r.team && t.indexOf(r.team.toLowerCase()) >= 0; });
  }
  pick.forEach(function(r){ add(r.name, roleOf(r)); });
  return out.map(function(o){ return { name: o.name, role: o.roles.join(", ") }; });
}

  if (!list.length) return "";

}

var mgLast = "";
function renderManagerPlan(){
  var list = $("mgPlan"); if (!list) return;

  var html = state.items.map(function(it, i){
    var sep = "";

    var cls = "fi", tag = "", tm = planned, sub = proj && proj !== planned ? "~" + proj : "", mt = [it.who, durTxt(it.dur)].filter(Boolean).join(" · ");
    if (i === ci) { cls += " isnow"; tag = "Now"; tm = "Now"; sub = ""; mt = [it.who, fmt(remainingMs()) + " left"].filter(Boolean).join(" · "); }
    else if (i === ni) {

      cls += " next";
      if (ci >= 0 && (overrun || mins <= 2)) { cls += " call"; tag = "Call to stage now"; }

      else tag = "Next" + (start ? " · in " + mins + " min" : "");

      '<div class="bd">' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') + '<div class="tt' + (big ? ' big' : '') + '">' + esc(it.title) + '</div>' +
      '<div class="mt">' + esc(mt) + '</div>' + chipsHtml(peopleFor(it)) + '</div></li>';
  }).join("");
  if (html !== mgLast) { list.innerHTML = html; mgLast = html; }

  if (window.onscroll) window.onscroll();

    '<div class="field"><label>Planned start (optional)</label><input class="input" id="fAt" type="time"></div>' +
    '<div class="field"><label>Duration</label><div class="dur"><input class="input" id="fMin" type="number" min="0" max="600" inputmode="numeric" style="width:90px"><span>min</span><input class="input" id="fSec" type="number" min="0" max="59" inputmode="numeric" style="width:90px"><span>sec</span></div></div>' +
    '<div class="field"><label>Setlist (optional)</label><textarea class="input" id="fSongs" placeholder="Praise | E | Victor&#10;Here As In Heaven | C# | Victor | 1 chorus in Portuguese"></textarea><small>One song per line: <b>Title | Key | Lead | Note</b> – key, lead and note are optional.</small></div>' +
    '<div class="sheet-actions"><button type="button" class="btn danger" id="fDel">Delete</button><button type="button" class="btn" id="fCancel">Cancel</button><button class="btn primary">Save</button></div>' +
  '</form></div>' +
  '<div class="sheet-bg" id="confirmBg" hidden style="align-items:center;padding:20px"><div class="confirm-box"><p id="confirmTxt"></p><div class="sheet-actions" style="margin:0"><button class="btn" id="confirmNo">Cancel</button><button class="btn primary" id="confirmYes">Yes</button></div></div></div>';
}

function goTo(s, id, run){
  var it = null;
  for (var k=0;k<s.items.length;k++) if (s.items[k].id === id) it = s.items[k];
  if (!it) return;
  s.currentId = id; s.songIdx = 0;
  s.remaining = it.dur*1000; s.running = !!run; s.endsAt = Date.now() + s.remaining;
}
var actions = {
  toggle: function(){ commit(function(s){
    var c = cur(s);
    if (!c) { if (s.items.length) goTo(s, s.items[0].id, true); return; }
    if (s.running) { s.remaining = s.endsAt - Date.now(); s.running = false; }
    else { s.endsAt = Date.now() + s.remaining; s.running = true; }
  }); },
  next: function(){ commit(function(s){
    var i = curIdx(s);
    if (i === -1) { if (s.currentId !== "__end" && s.items.length) goTo(s, s.items[0].id, true); return; }
    if (i + 1 < s.items.length) goTo(s, s.items[i+1].id, true);
    else { s.currentId = "__end"; s.running = false; s.remaining = 0; }
  }); },
  prev: function(){ commit(function(s){
    var i = curIdx(s);
    if (s.currentId === "__end" && s.items.length) { goTo(s, s.items[s.items.length-1].id, false); return; }
    if (i > 0) goTo(s, s.items[i-1].id, false);
    else { s.currentId = null; s.running = false; s.remaining = 0; }
  }); },
  reset: function(){ commit(function(s){ var c = cur(s); if (!c) return; s.running = false; s.remaining = c.dur*1000; }); },
  plus: function(){ adjust(60000); },
  minus: function(){ adjust(-60000); },
  songNext: function(){ commit(function(s){ var c = cur(s); if (c && s.songIdx < c.songs.length - 1) s.songIdx++; }); },
  songPrev: function(){ commit(function(s){ if (s.songIdx > 0) s.songIdx--; }); }
};
function adjust(d){ commit(function(s){ if (!cur(s)) return; if (s.running) s.endsAt += d; else s.remaining += d; }); }
function sendMsg(text){
  text = String(text || "").trim(); if (!text) return;
  var flash = $("msgFlash") ? $("msgFlash").checked : true;
  commit(function(s){ s.message = { text: text.slice(0,120), flash: flash }; });
  toast("Message sent");
}
function parseSongs(txt){
  return txt.split("\n").map(function(l){
    var p = l.split("|").map(function(x){ return x.trim(); });
    return { t: str(p[0], 80), key: str(p[1], 8), lead: str(p[2], 60), note: str(p.slice(3).join(" | "), 120) };
  }).filter(function(g){ return g.t; }).slice(0,40);
}
function songsToText(songs){
  return songs.map(function(g){
    var parts = [g.t, g.key || "", g.lead || ""]; if (g.note) parts.push(g.note);
    while (parts.length > 1 && !parts[parts.length-1]) parts.pop();
    return parts.join(" | ");
  }).join("\n");
}

var editingId = null;
function openSheet(id){
  editingId = id;
  var it = null; for (var k=0;k<state.items.length;k++) if (state.items[k].id === id) it = state.items[k];
  $("shTitle").textContent = it ? "Edit item" : "New item";
  $("fTitle").value = it ? it.title : "";
  $("fWho").value = it ? it.who : "";
  $("fAt").value = it ? it.at : "";
  $("fMin").value = it ? Math.floor(it.dur/60) : 5;
  $("fSec").value = it ? it.dur%60 : 0;
  $("fSongs").value = it ? songsToText(it.songs) : "";
  $("fDel").hidden = !it;
  $("sheetBg").hidden = false;
}
function closeSheet(){ $("sheetBg").hidden = true; editingId = null; }
function confirmBox(text, yes){
  $("confirmTxt").textContent = text; $("confirmBg").hidden = false;
  $("confirmYes").onclick = function(){ $("confirmBg").hidden = true; yes(); };
  $("confirmNo").onclick = function(){ $("confirmBg").hidden = true; };
}

function bindControl(){
  bindPairBox("cp");
  $("cShow").addEventListener("click", function(){ showOnAllScreens(); toast("Stage & Backstage now show this event"); });
  document.querySelectorAll("[data-act]").forEach(function(b){ b.addEventListener("click", function(){ actions[b.getAttribute("data-act")](); }); });
  $("msgForm").addEventListener("submit", function(e){ e.preventDefault(); sendMsg($("msgInput").value); $("msgInput").value = ""; $("msgInput").blur(); });

  $("cMsgClear").addEventListener("click", function(){ commit(function(s){ s.message = null; }); });
  $("cSetlist").addEventListener("click", function(e){ var r = e.target.closest("[data-song]"); if (r) { var n = +r.getAttribute("data-song"); commit(function(s){ s.songIdx = n; }); } });
  $("addBtn").addEventListener("click", function(){ openSheet(null); });
  $("cList").addEventListener("click", function(e){
    var go = e.target.closest("[data-go]"), ed = e.target.closest("[data-edit]"), up = e.target.closest("[data-up]"), dn = e.target.closest("[data-down]");
    if (go) { var gid = go.getAttribute("data-go"); commit(function(s){ goTo(s, gid, true); }); }
    else if (up || dn) {
      var mid = (up || dn).getAttribute(up ? "data-up" : "data-down"), dir = up ? -1 : 1;
      commit(function(s){
        var i = -1; for (var k=0;k<s.items.length;k++) if (s.items[k].id === mid) i = k;
        var j = i + dir; if (i < 0 || j < 0 || j >= s.items.length) return;
        var t = s.items[i]; s.items[i] = s.items[j]; s.items[j] = t;
      });
    }
    else if (ed) openSheet(ed.getAttribute("data-edit"));
  });
  $("sheetBg").addEventListener("click", function(e){ if (e.target === $("sheetBg")) closeSheet(); });
  $("fCancel").addEventListener("click", closeSheet);
  $("fDel").addEventListener("click", function(){
    var id = editingId; closeSheet();
    commit(function(s){
      s.items = s.items.filter(function(i){ return i.id !== id; });
      if (s.currentId === id) { s.currentId = null; s.running = false; s.remaining = 0; }
    });
  });
  $("sheet").addEventListener("submit", function(e){
    e.preventDefault();
    var title = $("fTitle").value.trim() || "Untitled", who = $("fWho").value.trim();
    var at = /^\d{2}:\d{2}/.test($("fAt").value) ? $("fAt").value.slice(0,5) : "";
    var dur = Math.max(0, Math.min(36000, (parseInt($("fMin").value,10)||0)*60 + Math.min(59, parseInt($("fSec").value,10)||0)));
    var songs = parseSongs($("fSongs").value);
    var id = editingId; closeSheet();
    commit(function(s){
      if (id) s.items.forEach(function(i){
        if (i.id !== id) return;
        var diff = (dur - i.dur)*1000;
        i.title = title; i.who = who; i.dur = dur; i.at = at; i.songs = songs;
        if (s.currentId === id) { if (diff) { if (s.running) s.endsAt += diff; else s.remaining += diff; } s.songIdx = Math.min(s.songIdx, Math.max(0, songs.length-1)); }
      });
      else s.items.push({ id: uid(), title: title, who: who, dur: dur, at: at, songs: songs });
    });
  });
  $("sName").addEventListener("change", function(){ var v = this.value.trim() || "Stage Clock"; commit(function(s){ s.settings.eventName = v.slice(0,40); }); });
  $("sPco").addEventListener("change", function(){
    var v = this.value.trim();
    if (v && !/^https:\/\/[^\s"<>]{4,300}$/.test(v)) { toast("That link doesn’t look right"); return; }
    commit(function(s){ s.settings.pcoUrl = v; s.pco = { hash: "", syncedAt: 0 }; });
    if (v) setTimeout(function(){ pcoCheck(true); }, 300);
  });
  $("kCopy").addEventListener("click", function(){ if (navigator.clipboard) navigator.clipboard.writeText(teamKey()).then(function(){ toast("Team key copied – keep it private"); }, function(){}); });
  $("kOut").addEventListener("click", function(){ confirmBox("Disconnect this device? You’ll need to connect it again with a code or the team key.", function(){ setTeamKey(""); route(); }); });
  $("credSave").addEventListener("click", function(){
    var id = $("cId").value.trim(), sec = $("cSecret").value.trim();
    if (!id || !sec) { toast("Enter Application ID and Secret"); return; }
    setCred({ id: id, secret: sec }); $("cId").value = ""; $("cSecret").value = "";
    commit(function(s){ s.pco = { hash: "", syncedAt: 0 }; });
    fillControl(); pcoCheck(true);
  });
  $("credDel").addEventListener("click", function(){ setCred(null); pcoStatus = { state: "", text: "", at: 0 }; fillControl(); toast("Token removed from this device"); });
  $("sPlan").addEventListener("change", function(){
    var m = this.value.match(/plans\/(\d+)/) || this.value.trim().match(/^(\d+)$/);
    if (!m) { toast("Paste the plan link from Planning Center"); return; }
    var plan = m[1], cred = getCred();
    if (!cred) { toast("Connect this device first"); return; }
    pcoStatus = { state: "busy", text: "Looking up the plan …", at: Date.now() }; renderPco();
    resolvePlan(plan, cred).then(function(st){
      commit(function(s){ s.settings.pcoSt = st; s.settings.pcoPlan = plan; s.pco = { hash: "", syncedAt: 0 }; });
      pcoCheck(true);
    }, function(e){ pcoStatus = { state: "err", text: (e && e.msg) || "Couldn’t find that plan", at: Date.now() }; renderPco(); });
  });
  $("sPcoAuto").addEventListener("change", function(){ var v = this.checked; commit(function(s){ s.settings.pcoAuto = v; }); });
  $("pcoNow").addEventListener("click", function(){ if (!pcoMode()) { toast("Connect this device first"); return; } pcoCheck(true); });
  $("cPco").addEventListener("click", function(e){
    var b = e.target.closest("[data-pco]"); if (!b || !pcoPending) return;
    if (b.getAttribute("data-pco") === "yes") { var pp = pcoPending; applyPco(pp.items, pp.hash); toast("Updated from Planning Center"); }
    else { pcoPending = null; }
    renderPco();
  });
  $("sEnd").addEventListener("change", function(){ var v = /^\d{2}:\d{2}/.test(this.value) ? this.value.slice(0,5) : ""; commit(function(s){ s.settings.endAt = v; }); });
  $("cCatch").addEventListener("click", function(e){
    var b = e.target.closest("[data-catch]"); if (!b) return;
    var sg = suggestion(); if (!sg) return;
    if (b.getAttribute("data-catch") === "no") { dismissedOver = sg.over; renderCatch(); return; }
    commit(function(s){ sg.cuts.forEach(function(c){ s.items.forEach(function(it){ if (it.id === c.id) it.dur = Math.max(60, it.dur - c.min*60); }); }); });
    dismissedOver = 0;
    toast("Run sheet updated");
  });
  $("sWarn").addEventListener("change", function(){ var v = Math.max(0, Math.min(30, parseFloat(this.value)||0)); commit(function(s){ s.settings.warnSec = Math.round(v*60); }); });
  [["sSongs","showSongs"],["sClock","showClock"],["sNext","showNext"],["sBlank","blank"]].forEach(function(p){
    $(p[0]).addEventListener("change", function(){ var v = this.checked; commit(function(s){ s.settings[p[1]] = v; }); });
  });
  $("resetAll").addEventListener("click", function(){
    confirmBox("Reset the run sheet? Everything is reloaded from Planning Center and the clock stops. Your changes will be lost.", function(){
      commit(function(s){ var n = clone(DEFAULT); n.items = []; n.settings = s.settings; Object.keys(n).forEach(function(k){ s[k] = n[k]; }); });
      if (pcoMode()) setTimeout(function(){ pcoCheck(true); }, 300);
    });
  });
}

function setVal(id, v){ var el = $(id); if (el && document.activeElement !== el) el.value = v; }
function fillControl(){
  if (!$("cLive")) return;
  var s = state.settings, c = cur();
  $("cEvent").textContent = s.eventName;
  $("cTitle").textContent = c ? c.title : (state.currentId === "__end" ? "End of run sheet" : "Nothing live yet");
  $("cSub").textContent = c ? (c.who ? c.who + " · " : "") + durTxt(c.dur) : (state.items.length ? "Tap ▶ Start, or ▶ on any item" : "Add your run sheet below");
  var g = c && c.songs.length ? c.songs[Math.min(state.songIdx, c.songs.length-1)] : null;
  $("cSong").textContent = g ? "♪ " + g.t + (g.key ? " · " + g.key : "") : "";

  var card = $("cSetCard");
  if (c && c.songs.length) {
    card.hidden = false;
    var k = Math.min(state.songIdx, c.songs.length-1);
    $("cSetlist").innerHTML = c.songs.map(function(sg, n){
      return '<li class="sg' + (n === k ? " cur" : n < k ? " done" : "") + '" data-song="' + n + '"><span class="n">' + (n+1) + '</span>' +
        '<span class="nm">' + esc(sg.t) + (sg.note ? '<small>⚑ ' + esc(sg.note) + '</small>' : '') + '</span>' +
        (sg.lead ? '<span class="ld">' + esc(sg.lead) + '</span>' : '') + (sg.key ? '<span class="key">' + esc(sg.key) + '</span>' : '') + '</li>';
    }).join("");
  } else card.hidden = true;

  if (state.message && state.message.text) { $("cMsgCur").hidden = false; $("cMsgTxt").textContent = "Showing on stage: " + state.message.text; }
  else $("cMsgCur").hidden = true;
  setVal("sName", s.eventName);
  setVal("sWarn", +(s.warnSec/60).toFixed(1));
  setVal("sEnd", s.endAt || "");
  setVal("sPco", s.pcoUrl || "");
  setVal("sPlan", "https://services.planningcenteronline.com/plans/" + s.pcoPlan);
  var hasCred = !!getCred();
  $("credForm").hidden = hasCred; $("credSet").hidden = !hasCred;
  $("sPcoAuto").checked = !!s.pcoAuto;
  renderPco();
  $("sSongs").checked = !!s.showSongs; $("sClock").checked = !!s.showClock; $("sNext").checked = !!s.showNext; $("sBlank").checked = !!s.blank;
  renderList();
}
function renderList(){
  var list = $("cList"); if (!list) return;
  var items = state.items, ci = curIdx();
  if (!items.length) { list.innerHTML = '<li class="empty">' + (synced ? "No items yet." : "Loading …") + '</li>'; $("cTotal").textContent = ""; return; }
  var total = 0; items.forEach(function(i){ total += i.dur; });
  $("cTotal").textContent = "Total " + durTxt(total);
  var t = Date.now(); if (ci >= 0) t += Math.max(0, remainingMs());
  var hasPre = items.some(function(i){ return i.pre; }), firstMain = -1;
  for (var q = 0; q < items.length; q++) if (!items[q].pre) { firstMain = q; break; }
  list.innerHTML = items.map(function(it, idx){
    var sep = "";
    if (hasPre && idx === 0 && it.pre) sep = '<li class="sep">Setup & soundcheck</li>';
    if (hasPre && idx === firstMain) sep = '<li class="sep">Event</li>';
    return sep + rowHtml(it, idx);
  }).join("");
  function rowHtml(it, idx){
    var cls = "item", when;
    if (idx === ci) { cls += " is-live"; when = "live"; }
    else if ((ci >= 0 && idx < ci) || state.currentId === "__end") { cls += " done"; when = it.at ? atTxt(it.at) : ""; }
    else { when = ci >= 0 ? (it.at ? atTxt(it.at) + " (~" + clockTxt(new Date(t)) + ")" : "~" + clockTxt(new Date(t))) : atTxt(it.at); t += it.dur*1000; }
    var meta = [when, it.who, durTxt(it.dur), it.songs.length ? it.songs.length + " songs" : ""].filter(Boolean).join(" · ");
    return '<li class="' + cls + '"><button class="go" data-go="' + it.id + '" aria-label="Go live">▶</button>' +
      '<div class="it-body" data-edit="' + it.id + '"><div class="it-title">' + (idx+1) + '. ' + esc(it.title) + '</div><div class="it-meta">' + esc(meta) + '</div></div>' +
      '<div class="mv"><button data-up="' + it.id + '" aria-label="Move up">▲</button><button data-down="' + it.id + '" aria-label="Move down">▼</button></div></li>';
  }
}
function renderSched(){
  var el = $("cSched"); if (!el) return;
  var p = projection(), te = targetEnd();
  if (!cur() || !p.finish || !te) { el.textContent = ""; el.className = "sched"; return; }
  var d = Math.round((p.finish - te) / 60000), end = clockTxt(new Date(p.finish));
  if (Math.abs(d) < 1) { el.textContent = "On schedule · ends " + end; el.className = "sched ok"; }
  else if (d > 0) { el.textContent = "Ends ~" + end + " · " + d + " min over"; el.className = "sched late"; }
  else { el.textContent = "Ends ~" + end + " · " + (-d) + " min early"; el.className = "sched ok"; }
}
var dismissedOver = 0, lastCatchKey = "";
function renderCatch(){
  var box = $("cCatch"); if (!box) return;
  var sg = suggestion();
  if (!sg || (dismissedOver && sg.over < dismissedOver + 3)) { box.hidden = true; lastCatchKey = ""; return; }
  var key = sg.over + "|" + sg.cuts.map(function(c){ return c.id + c.min; }).join(",");
  if (key === lastCatchKey && !box.hidden) return;
  lastCatchKey = key;
  var h = '<h3>⏱ Running ' + sg.over + ' min over</h3>' +
    '<p>Projected end ~' + esc(clockTxt(new Date(sg.finish))) + ', target ' + esc(clockTxt(new Date(sg.target))) + '.' + (sg.cuts.length ? ' To catch up you could shorten:' : ' There’s nothing left that can be shortened automatically.') + '</p>';
  if (sg.cuts.length) {
    h += '<ul>' + sg.cuts.map(function(c){ return '<li>' + esc(c.title) + ' <span>−' + c.min + ' min (' + Math.round((c.dur/60) - c.min) + ' min)</span></li>'; }).join("") + '</ul>';
    if (sg.short > 0) h += '<p>That still leaves ' + sg.short + ' min – maybe drop a song.</p>';
    h += '<div class="row"><button class="btn" data-catch="no">Dismiss</button><button class="btn primary" data-catch="yes">Apply</button></div>';
  } else h += '<div class="row"><button class="btn" data-catch="no">Dismiss</button></div>';
  box.innerHTML = h; box.hidden = false;
}

/* ============================================================
   TICK
   ============================================================ */
var tickN = 0;
function tick(){
  tickN++;
  var c = cur(), r = remainingMs(), ph = phase();
  var frac = c && c.dur ? Math.max(0, Math.min(1, r / (c.dur*1000))) : 0;
  if (view === "stage" && $("stage")) {
    var st = $("stage");
    st.classList.remove("idle","ok","warn","over"); st.classList.add(ph);
    $("stClock").textContent = clockTxt();
    if (c) $("stTimer").textContent = fmt(r); else $("stTimer").innerHTML = clockBig();
    $("stBar").style.width = (frac*100) + "%";
    $("stState").textContent = !c ? "" : ph === "over" ? "Overtime" : (!state.running ? "Paused" : "");
  } else if (view === "backstage") {
    tickBackstage();
  } else if (view === "manager") {
    tickManager();
  } else if (view === "control" && $("cLive")) {
    $("cLive").className = "live " + (ph === "idle" ? "" : ph);
    $("cTimer").textContent = c ? fmt(r) : "0:00";
    $("cTimer").style.opacity = c ? 1 : .3;
    $("cBar").style.width = (frac*100) + "%";
    var tg = $("cToggle");
    if (c && state.running) { tg.textContent = "⏸ Pause"; tg.classList.add("running"); }
    else { tg.textContent = "▶ Start"; tg.classList.remove("running"); }
    if (tickN % 25 === 0) renderList();
    renderSched();
    if (tickN % 5 === 0) renderCatch();
  }
}
setInterval(tick, 200);

var toastT = null;
function toast(msg){ var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 2200); }

window.addEventListener("load", function(){ if ((ROOM || FOLLOW) && view !== "devices" && view !== "pick" && !clients.length) connect(); });
route();
})();
</script>
